version: '3.8'

services:
  cypress:
    image: cypress/included:13.6.2
    container_name: cypress-sentinel
    working_dir: /e2e
    
    # Environment Variables untuk konfigurasi
    environment:
      - CYPRESS_baseUrl=${BASE_URL:-https://www.google.com}
      # SPEC_PATTERN untuk memilih test suite yang akan dijalankan
      # Options:
      #   - cypress/e2e/functional/**/*.cy.js (hanya functional tests)
      #   - cypress/e2e/performance/**/*.cy.js (hanya performance tests)
      #   - cypress/e2e/security/**/*.cy.js (hanya security tests)
      #   - cypress/e2e/**/*.cy.js (semua tests)
      - SPEC_PATTERN=${SPEC_PATTERN:-cypress/e2e/**/*.cy.js}
      - CYPRESS_video=false
      - CYPRESS_screenshotOnRunFailure=true
    
    # Volume mounting untuk edit lokal dan akses report
    volumes:
      - ./cypress:/e2e/cypress
      - ./cypress.config.js:/e2e/cypress.config.js
      - ./package.json:/e2e/package.json
      - ./reports:/e2e/reports
      # node_modules menggunakan named volume agar npm install berfungsi
      - cypress_node_modules:/e2e/node_modules
    
    # Command untuk menjalankan test dalam headless Chrome
    command: >
      sh -c "
        echo '=== Installing Dependencies ===' &&
        npm install &&
        echo '=== Running Cypress Tests ===' &&
        echo 'SPEC_PATTERN: ${SPEC_PATTERN:-cypress/e2e/**/*.cy.js}' &&
        npx cypress run --browser chrome --headless --spec '${SPEC_PATTERN:-cypress/e2e/**/*.cy.js}' &&
        echo '=== Tests Completed ===' &&
        echo 'Report available at: reports/'
      "
    
    # Network configuration (optional)
    networks:
      - cypress-network
    
    # Resource limits (optional, sesuaikan dengan kebutuhan)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

networks:
  cypress-network:
    driver: bridge

volumes:
  cypress_node_modules:
